name: ASVH 225 Baseline and HARDEN-011

on:
  push:
    branches: [asvh-harden-011-from-225-baseline]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt
      - name: Reproduce frozen 225 positive baseline
        run: >
          pytest -q
          tests/test_asvh_harden_00[1-9].py
          tests/test_asvh_harden_00[1-9]_hostile.py
          tests/test_asvh_harden_010_final_bind_remediation.py
          tests/test_asvh_harden_010_attempt_binding_attack.py
          tests/test_asvh_harden_010_whole_chain_hostile.py
      - name: Execute frozen HARDEN-011 route closure probes
        if: success()
        run: pytest -q tests/test_asvh_harden_011_execution_route_attack.py
      - name: Attack HARDEN-011 remediation second order
        if: success()
        run: pytest -q tests/test_asvh_harden_011_second_order.py

# remediation verification trigger

# second-order remediation rerun

  third-order-durable-boundary:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt
      - name: Attack H11 third-order durable-boundary
        run: pytest -q tests/test_asvh_harden_011_third_order.py

# third-order remediation rerun

  fourth-order-trust-boundary:
    needs: third-order-durable-boundary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt
      - name: Attack H11 fourth-order trust boundary
        # Fourth-order RED is intentionally preserved as the external-boundary finding.
        run: pytest -q tests/test_asvh_harden_011_fourth_order.py

  airp-002-worked-case:
    needs: third-order-durable-boundary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt
      - name: Execute AIRP-002 worked evidence case
        run: pytest -q tests/test_asvh_airp_002_worked_case.py

  airp-006-composition-challenge:
    needs: third-order-durable-boundary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt
      - name: Execute frozen AIRP-006 composition challenge
        run: pytest -q tests/test_asvh_airp_006_composition.py

  airp-008-direct-enforcement:
    needs: third-order-durable-boundary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt
      - name: Execute frozen AIRP-008 direct enforcement challenge
        run: pytest -q tests/test_asvh_airp_008_direct_enforcement.py

# AIRP-008 remediation rerun trigger
