name: ASVH HARDEN-001

on:
  push:
    branches:
      - asvh-harden-001-baseline
  workflow_dispatch:

jobs:
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: pip install pytest
      - name: Run frozen HARDEN-001 CTS
        run: pytest -q tests/test_asvh_harden_001.py
